name: taskora
description: "Taskora - Freelancer Marketplace SaaS Platform"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Navigation
  go_router: ^11.1.0



  # Backend & Database
  firebase_core: ^2.24.0
  firebase_auth: ^4.12.0
  firebase_analytics: ^10.9.0
  firebase_messaging: ^14.7.0
  firebase_crashlytics: ^3.4.0
  supabase_flutter: ^2.8.0

  # HTTP & Networking
  dio: ^5.3.0
  http: ^1.1.0
  connectivity_plus: ^5.0.0
  url_launcher: ^6.3.2

  # UI Components
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  intl: ^0.19.0

  # Payment
  flutter_stripe: ^9.3.0
  in_app_purchase: ^3.1.13
  in_app_purchase_android: ^0.3.0

  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Utils
  uuid: ^4.0.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Date & Time
  timezone: ^0.9.0
  # Auth / Social SignIn
  sign_in_with_apple: ^6.1.3
  # Image Handling
  image_picker: ^1.0.0
  image_cropper: ^8.0.2

  # Push Notifications
  flutter_local_notifications: ^17.0.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_dotenv: ^6.0.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/icon_app.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_app.jpeg"
  remove_alpha_ios: true